{% extends "base.html" %}
{% block title %}Bluesky — {{ brand.name }}{% endblock %}
{% block content %}
<h1>Bluesky</h1>
<p class="subtitle">Generate a post or thread for {{ brand.name }}. Review and edit before sending.</p>

<div class="card">
  <form hx-post="/brands/{{ brand.id }}/bluesky/generate" hx-target="#bluesky-result" hx-swap="innerHTML">
    <div class="field">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" name="prompt" rows="3" required placeholder="What should this post be about?"></textarea>
    </div>
    <div class="checkbox-field">
      <input type="checkbox" id="want_thread" name="want_thread"
             onchange="document.getElementById('post-count-field').style.display = this.checked ? 'block' : 'none'" />
      <label for="want_thread" style="margin:0;">Generate as thread</label>
    </div>
    <div class="field" id="post-count-field" style="display:none; max-width:200px;">
      <label for="post_count">Number of posts</label>
      <input type="number" id="post_count" name="post_count" min="2" max="10" value="3" />
    </div>
    <div class="actions">
      <button type="submit" class="btn">
        <span class="btn-text">Generate</span><span class="spinner"></span>
      </button>
    </div>
  </form>
</div>

<div id="bluesky-result"></div>
{% endblock %}
