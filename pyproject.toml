[project]
name = "agent-template"
version = "0.1.0"
description = "Opinionated general-purpose AI agent template"
license = "BSD-3-Clause"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai>=2.1.0",
    "pydantic-settings>=2.0",
    "logfire[fastapi]>=3.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pydantic-evals>=2.1.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "eval: marks tests as evals (require an API key; run with -m eval, skipped by default)",
]
addopts = "-m 'not eval'"

[tool.ruff]
line-length = 100
target-version = "py313"
# Skill scaffold payloads (e.g. .agents/skills/agent-web-ui/assets/) are
# templates copied into a *different*, future project — not this repo's own
# source. Linting them against this project's own known-first-party list
# (which has no idea about a "web" package that doesn't exist here) produces
# false-positive import-order errors having nothing to do with this repo.
extend-exclude = [".agents/skills/*/assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "db", "integrations", "web"]
# agent/agents/__init__.py re-exports a combined aliased import
# ("X as A, Y as B") — without this, isort flags it (I001).
combine-as-imports = true
